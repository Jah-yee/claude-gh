name: pos-demo CI

on:
  push:
    branches: [main]
    paths: ["pos-demo/**", ".github/workflows/pos-ci.yml"]
  pull_request:
    paths: ["pos-demo/**", ".github/workflows/pos-ci.yml"]

permissions:
  contents: read

jobs:
  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [inventory-service, sales-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests + Testcontainers integration tests (Docker is available on ubuntu-latest).
      - run: mvn -B verify -f pos-demo/${{ matrix.service }}/pom.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pos-demo/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pos-demo/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    needs: [service, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        working-directory: pos-demo
        run: docker compose build
