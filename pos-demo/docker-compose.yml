name: storelite

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: storelite
      POSTGRES_USER: storelite
      POSTGRES_PASSWORD: storelite
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "storelite"]
      interval: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI, guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment: &service-env
      DB_URL: jdbc:postgresql://postgres:5432/storelite
      RABBIT_HOST: rabbitmq
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  sales-service:
    build:
      context: .
      dockerfile: sales-service/Dockerfile
    environment:
      <<: *service-env
      INVENTORY_URL: http://inventory-service:8082
    ports: ["8081:8081"]
    # inventory-service declares the sale.completed queue; start after it so no event is dropped.
    depends_on:
      inventory-service: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["5173:80"]
    depends_on:
      sales-service: { condition: service_healthy }
