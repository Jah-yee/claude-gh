# Mirrors the Vite dev proxy in vite.config.ts.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/sales    { proxy_pass http://sales-service:8081; }
    location /api/alerts   { proxy_pass http://sales-service:8081; }
    location /api/products { proxy_pass http://inventory-service:8082; }

    location / {
        try_files $uri /index.html;
    }
}
