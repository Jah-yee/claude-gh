server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/storelite}
    username: ${DB_USER:storelite}
    password: ${DB_PASSWORD:storelite}
  flyway:
    schemas: inventory
    default-schema: inventory
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false   # after retries, reject -> dead-letter queue
        retry:
          enabled: true
          max-attempts: 3
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
