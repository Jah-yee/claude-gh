openapi: 3.0.3
info:
  title: StoreLite Sales API
  version: 1.0.0
  description: Checkout, sales history and low-stock alerts. Owned by sales-service.
servers:
  - url: http://localhost:8081
tags:
  - name: sales
  - name: alerts
paths:
  /api/sales:
    post:
      tags: [sales]
      operationId: createSale
      summary: Check out a basket. Prices are looked up from inventory-service and snapshotted on the sale.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSaleRequest'
      responses:
        '201':
          description: Sale created (receipt)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    get:
      tags: [sales]
      operationId: listSales
      summary: Most recent sales for a day (default today), newest first
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
  /api/sales/summary:
    get:
      tags: [sales]
      operationId: getSalesSummary
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: Totals for the day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummary'
  /api/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: Most recent low-stock alerts, newest first
      responses:
        '200':
          description: Alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Alert'
components:
  parameters:
    Date:
      name: date
      in: query
      required: false
      description: ISO date (yyyy-MM-dd). Defaults to today (server time zone).
      schema:
        type: string
        format: date
  responses:
    Problem:
      description: Error (RFC 9457 problem details)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TenderType:
      type: string
      enum: [CASH, CARD]
    CreateSaleRequest:
      type: object
      required: [lines, tenderType]
      properties:
        tenderType:
          $ref: '#/components/schemas/TenderType'
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SaleLineRequest'
    SaleLineRequest:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
    Sale:
      type: object
      required: [id, createdAt, tenderType, totalCents, lines]
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        tenderType:
          $ref: '#/components/schemas/TenderType'
        totalCents:
          type: integer
          format: int64
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLine'
    SaleLine:
      type: object
      required: [sku, name, unitPriceCents, quantity]
      properties:
        sku:
          type: string
        name:
          type: string
        unitPriceCents:
          type: integer
          format: int64
        quantity:
          type: integer
    SalesSummary:
      type: object
      required: [date, count, totalCents]
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
          format: int64
        totalCents:
          type: integer
          format: int64
    Alert:
      type: object
      required: [id, sku, remaining, createdAt]
      properties:
        id:
          type: integer
          format: int64
        sku:
          type: string
        remaining:
          type: integer
        createdAt:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
